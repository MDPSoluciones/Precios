<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDP SOLUCIONES</title>

    <!-- Ícono del sitio -->
    <link rel="icon" href="images/logoCircDor.png" type="image/x-icon">

    <!-- Estilos -->
    <link rel="stylesheet" href="styles/styles.css?v=6">
</head>

<body class="halloween">
    <!-- ================= HEADER ================= -->
    <header id="mainHeader">
        <!-- 🎃 HALLOWEEN (quitar class="halloween" del <body> para desactivar todo) -->
        <div class="halloween-deco web web-left">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
                    <path d="M0 0 L100 0 M0 0 L97 26 M0 0 L82 58 M0 0 L58 82 M0 0 L26 97 M0 0 L0 100"/>
                    <path d="M22 0 Q17 17 0 22 M44 0 Q35 35 0 44 M66 0 Q52 52 0 66 M88 0 Q70 70 0 88"/>
                </g>
            </svg>
        </div>
        <div class="halloween-deco web web-right">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
                    <path d="M0 0 L100 0 M0 0 L97 26 M0 0 L82 58 M0 0 L58 82 M0 0 L26 97 M0 0 L0 100"/>
                    <path d="M22 0 Q17 17 0 22 M44 0 Q35 35 0 44 M66 0 Q52 52 0 66 M88 0 Q70 70 0 88"/>
                </g>
            </svg>
        </div>
        <div class="halloween-deco spider-wrap" id="spiderWrap">
            <div class="spider-thread"></div>
            <svg class="spider" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g stroke="#111" stroke-width="2" stroke-linecap="round" fill="none">
                    <path d="M14 18 L5 11 L2 16 M14 21 L4 21 L2 27 M15 24 L7 31 L8 37 M26 18 L35 11 L38 16 M26 21 L36 21 L38 27 M25 24 L33 31 L32 37"/>
                </g>
                <ellipse cx="20" cy="26" rx="8" ry="9" fill="#1a1a1a"/>
                <circle cx="20" cy="15" r="5.5" fill="#1a1a1a"/>
                <circle cx="18" cy="14" r="1.3" fill="#ff7a00"/>
                <circle cx="22" cy="14" r="1.3" fill="#ff7a00"/>
            </svg>
        </div>

        <button class="menu-btn" id="menuBtn" aria-label="Ver categorías">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
        </button>

        <img src="images/LogoPrincDor.png" alt="MDP Soluciones" class="logo">
        <h2 class="title">LISTA DE PRECIOS</h2>
        <div class="spacer"></div>

        <div class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
            </svg>
            <input type="text" id="searchInput" placeholder="Buscar en todo el catálogo...">
        </div>

        <!-- Botones de vista Grilla / Lista -->
        <div class="view-toggle" title="Cambiar vista">
            <button id="btnGrid" title="Grilla" aria-label="Vista grilla">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="3" width="8" height="8" rx="1" />
                    <rect x="13" y="3" width="8" height="8" rx="1" />
                    <rect x="3" y="13" width="8" height="8" rx="1" />
                    <rect x="13" y="13" width="8" height="8" rx="1" />
                </svg>
            </button>
            <button id="btnList" title="Lista" aria-label="Vista lista">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="4" width="18" height="4" rx="1" />
                    <rect x="3" y="10" width="18" height="4" rx="1" />
                    <rect x="3" y="16" width="18" height="4" rx="1" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Fondo oscuro al abrir el menú en celular -->
    <div class="backdrop" id="backdrop"></div>

    <!-- ================= LAYOUT ================= -->
    <div class="layout">
        <aside id="sidebar" aria-label="Categorías"></aside>
        <main id="main">
            <div class="loading">Cargando productos...</div>
        </main>
    </div>

    <!-- Botón flotante para WhatsApp -->
    <a href="https://wa.me/5493364202556?text=Hola!%20Estoy%20interesado%20en%20un%20producto." class="whatsapp-float"
        target="_blank" title="Escríbenos por WhatsApp">
        <img src="images/whatsapp-icon.png" alt="WhatsApp">
    </a>

    <script src="scripts/script.js?v=6"></script>
</body>

</html>
