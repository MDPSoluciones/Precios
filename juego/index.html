<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ubicá la cámara · MDP Soluciones</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#303030;--h:#D9DAD4;--o:#BEA167;--cr:#F5F1E8;--ok:#2e9e68;--no:#d9534f}
*{box-sizing:border-box}
body{margin:0;background:var(--cr);color:var(--c);font-family:'DM Sans',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 30px;gap:12px}
h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin:0;letter-spacing:.05em;text-align:center}
h1 span{color:var(--o)}
.sub{margin:0;text-align:center;max-width:420px;line-height:1.4;font-size:.95rem}
.pill{background:var(--c);color:var(--cr);border-radius:99px;padding:4px 14px;font-size:.85rem}
.wrap{width:min(92vw,420px);display:flex;flex-direction:column;align-items:center;gap:10px}
#stage{position:relative;width:min(78vw,330px);aspect-ratio:541/653;touch-action:none;cursor:crosshair;user-select:none}
#stage img{position:absolute;-webkit-user-drag:none;user-select:none;pointer-events:none}
#bg{left:0;top:0;width:100%;height:100%}
#piece,#ghost{transform:translate(-50%,-50%)}
#ghost{display:none;border-radius:50%;outline:2px dashed var(--ok);outline-offset:2px;background:rgba(46,158,104,.18);aspect-ratio:83/84}
.sl{width:100%}
#size{-webkit-appearance:none;appearance:none;display:block;width:100%;height:36px;margin:0;background:transparent;touch-action:pan-y;outline:none}
#size::-webkit-slider-runnable-track{height:6px;background:var(--h);border-radius:3px}
#size::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--o);border:3px solid var(--c);margin-top:-11px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#size::-moz-range-track{height:6px;background:var(--h);border-radius:3px}
#size::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--o);border:3px solid var(--c)}
.ticks{position:relative;height:18px;margin:-6px 14px 0;pointer-events:none}
.ticks i{position:absolute;top:0;width:2px;margin-left:-1px;background:var(--c);opacity:.45;border-radius:1px}
.ticks i.m{opacity:.6}.ticks i.M{opacity:.9;width:2.5px}
html,body,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;font-weight:700;background:var(--o);color:var(--c);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;letter-spacing:.03em}
button:active{transform:scale(.96)}
button:disabled{opacity:.35}
button.sec{background:var(--h)}
button.sq{padding:10px 0;font-size:1.2rem;background:var(--h)}
#ok{width:100%}
#res{width:100%;display:none;flex-direction:column;gap:12px;text-align:left}
.lbl{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.big{font-family:'DM Sans',sans-serif;font-weight:700;font-size:4.2rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.verd{background:var(--o);border:2px solid var(--c);padding:12px 16px}
.verd b{display:block;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.verd span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--c);border-left:0;border-right:0}
.stats div{padding:10px 12px;border-left:2px solid var(--c)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-size:1.25rem}
.stats span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.stats .rec{background:var(--o)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts button{border-radius:0;border:2px solid var(--c);background:var(--c);color:var(--cr);text-transform:uppercase;display:flex;justify-content:space-between;padding:16px;font-size:1rem}
.acts button.alt{background:var(--o);color:var(--c)}
.hid{display:none!important}
.small{font-size:.82rem;opacity:.75}
</style>
</head>
<body>

<script>
/* Datos reales de la foto (541 × 653 px): la cámara original va con centro en (146,5 ; 110) y mide 83 px de ancho */
const CX=146.5/541*100, CY=110/653*100, CW=83/541*100; // en % de la foto
const IMG_W=541, MM_PX=0.29; // mm por píxel (aprox.: ancho real del teléfono ≈ 71,5 mm). Ajustable.
const $=id=>document.getElementById(id);
const stage=$('stage'),piece=$('piece'),ghost=$('ghost'),size=$('size'),ok=$('ok'),res=$('res'),ctr=$('controles');
const nf=(n,d=2)=>n.toFixed(d).replace('.',',');
let pos,w,s,lo,hi,phase='',mejor=0,anim=null;
try{mejor=+localStorage.getItem('mdp_cam_mejor')||0}catch(e){}

// El slider (0–100) se traduce a tamaño con una escala distinta en cada intento: así su posición no sirve de referencia.
function draw(){w=lo+(hi-lo)*s/100;piece.style.left=pos.x+'%';piece.style.top=pos.y+'%';piece.style.width=w+'%';size.value=s}
function load(){
  cancelAnimationFrame(anim);
  ghost.style.display='none';res.style.display='none';res.innerHTML='';
  pos={x:20+Math.random()*60,y:55+Math.random()*35};
  lo=CW*(0.2+Math.random()*0.45);            // tamaño con el slider al mínimo
  hi=CW*(1.5+Math.random()*1.5);             // tamaño con el slider al máximo
  const sOk=(CW-lo)/(hi-lo)*100;             // posición del slider donde el tamaño es el correcto
  do{s=5+Math.random()*90}while(Math.abs(s-sOk)<15); // arranca lejos del valor correcto
  ok.style.display='';ctr.style.display='flex';phase='play';draw();
}
function move(e){
  const b=stage.getBoundingClientRect();
  pos.x=Math.min(100,Math.max(0,(e.clientX-b.left)/b.width*100));
  pos.y=Math.min(100,Math.max(0,(e.clientY-b.top)/b.height*100));
  draw();
}
stage.addEventListener('pointerdown',e=>{if(phase==='play'){stage.setPointerCapture(e.pointerId);move(e)}});
stage.addEventListener('pointermove',e=>{if(phase==='play'&&e.buttons)move(e)});
size.oninput=()=>{if(phase==='play'){s=+size.value;draw()}};
// rayitas de la regla (cada 2,5 %; media cada 5 %; larga cada 10 %)
(()=>{const tk=$('ticks');for(let i=0;i<=40;i++){const e=document.createElement('i');e.style.left=(i*2.5)+'%';
  const big=i%4===0,mid=i%2===0;e.className=big?'M':mid?'m':'';e.style.height=(big?18:mid?12:7)+'px';tk.appendChild(e)}})();

const VERD=[
 [97,'Perfecto','Técnico de primera.'],
 [90,'Excelente','Casi no se nota la diferencia.'],
 [75,'Muy bien','Pero la cámara quedó algo corrida.'],
 [55,'Zafa','Pero la cámara te quedó medio corrida.'],
 [30,'Regular','Se puede mejorar.'],
 [0,'Flojo','Mejor dejá los armados para nosotros.']
];

const SITE='mdpsoluciones.com.ar/juego';
async function makeCard(d){
  try{await Promise.all([document.fonts.load('700 100px "DM Sans"'),document.fonts.load('400 20px "DM Sans"')])}catch(e){}
  const W=1200,H=630,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),F='"DM Sans",Arial,sans-serif';
  const INK='#303030',GOLD='#BEA167',CREAM='#F5F1E8',GREEN='#2e9e68';
  const ls=v=>{if('letterSpacing' in x)x.letterSpacing=v+'px'};
  const txt=(s,px,py,font,color,al)=>{x.font=font;x.fillStyle=color;x.textAlign=al||'left';x.fillText(s,px,py)};
  x.fillStyle=CREAM;x.fillRect(0,0,W,H);
  // encabezado
  ls(1);txt('UBICÁ LA CÁMARA.',48,84,'700 48px '+F,INK);
  ls(6);txt('MDP SOLUCIONES',W-48,80,'700 18px '+F,GOLD,'right');ls(0);
  // panel con el teléfono
  const PX=48,PY=108,PW=400,PH=410,s=(PH-24)/653,iw=541*s,ih=653*s,ox=PX+(PW-iw)/2,oy=PY+12;
  x.fillStyle='#fff';x.fillRect(PX,PY,PW,PH);
  x.drawImage(bg,ox,oy,iw,ih);
  const gx=ox+CX/100*iw, gy=oy+CY/100*ih, gr=CW/100*iw/2;
  const pw=d.w/100*iw, ph=pw*84/83, qx=ox+d.x/100*iw, qy=oy+d.y/100*ih;
  x.drawImage(piece,qx-pw/2,qy-ph/2,pw,ph);
  x.beginPath();x.arc(gx,gy,gr,0,7);x.fillStyle='rgba(46,158,104,.22)';x.fill();
  x.setLineDash([7,6]);x.lineWidth=3.5;x.strokeStyle=GREEN;x.stroke();x.setLineDash([]);
  x.beginPath();x.moveTo(qx,qy);x.lineTo(gx,gy);x.lineWidth=2.5;x.strokeStyle='#fff';x.stroke();
  x.beginPath();x.arc(qx,qy,5,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2.5;x.strokeStyle=INK;x.stroke();
  x.beginPath();x.arc(gx,gy,5,0,7);x.fillStyle=INK;x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke();
  x.lineWidth=3;x.strokeStyle=INK;x.strokeRect(PX,PY,PW,PH);
  ls(1);txt('Círculo punteado: dónde iba la cámara.',PX,544,'400 15px '+F,INK);ls(0);
  // resultado
  const RX=500,RW=W-48-RX;
  ls(5);txt('PRECISIÓN',RX,140,'400 20px '+F,INK);ls(-3);
  txt(d.score+'%',RX-4,262,'700 124px '+F,INK);ls(0);
  x.fillStyle=GOLD;x.fillRect(RX,290,RW,88);x.lineWidth=3;x.strokeStyle=INK;x.strokeRect(RX,290,RW,88);
  ls(1);txt(d.verd.toUpperCase(),RX+22,336,'700 38px '+F,INK);
  ls(2);txt(d.sub.toUpperCase(),RX+22,364,'400 16px '+F,INK);ls(0);
  const cw=RW/3,sy=402,sh=104;
  x.fillStyle=GOLD;x.fillRect(RX+cw*2,sy,cw,sh);
  x.fillStyle=INK;x.fillRect(RX,sy,RW,3);x.fillRect(RX,sy+sh-3,RW,3);
  x.fillRect(RX+cw,sy,3,sh);x.fillRect(RX+cw*2,sy,3,sh);
  const cells=[[d.mm,'DEL CENTRO'],[d.tam,'TAMAÑO'],[d.best,d.rec?'¡RÉCORD!':'MI MEJOR']];
  cells.forEach((cl,i)=>{const cx0=RX+cw*i+(i?22:0);ls(0);txt(cl[0],cx0,sy+54,'700 32px '+F,INK);ls(2);txt(cl[1],cx0,sy+84,'400 15px '+F,INK)});ls(0);
  // pie
  x.fillStyle=INK;x.fillRect(0,566,W,64);
  ls(1);txt('¿LO SUPERÁS?',48,609,'700 30px '+F,CREAM);ls(0);
  txt(SITE,W-48,608,'400 25px '+F,GOLD,'right');
  return new Promise(r=>c.toBlob(r,'image/png'));
}
ok.onclick=()=>{
  if(phase!=='play')return;
  phase='done';
  const b=stage.getBoundingClientRect();
  const dx=pos.x-CX, dy=(pos.y-CY)*(b.height/b.width); // en % del ancho del teléfono
  const posErr=Math.hypot(dx,dy);
  const sizeDiff=(w-CW)/CW*100; // + más grande, − más chico
  const score=Math.max(0,100-posErr*6-Math.abs(sizeDiff)*0.6);
  const mm=posErr/100*IMG_W*MM_PX;
  const record=score>mejor;
  if(record){mejor=score;try{localStorage.setItem('mdp_cam_mejor',score)}catch(e){}}
  ctr.style.display='none';ok.style.display='none';
  ghost.style.left=CX+'%';ghost.style.top=CY+'%';ghost.style.width=CW+'%';ghost.style.display='block';
  const v=VERD.find(x=>score>=x[0]);
  const sg=sizeDiff>0?'+':sizeDiff<0?'−':'';
  const tamTxt=Math.abs(sizeDiff)<.05?'le acerté al tamaño justo':'me quedó '+nf(Math.abs(sizeDiff),1)+'% más '+(sizeDiff>0?'grande':'chica');
  const txt='📱 Ubiqué la cámara a '+nf(mm,1)+' mm de su lugar y '+tamTxt+'. Precisión: '+nf(score)+'%. ¿Lo superás? https://'+SITE;
  let cardBlob=null;
  makeCard({x:pos.x,y:pos.y,w:w,score:nf(score),verd:v[1],sub:v[2],mm:nf(mm,1)+' mm',tam:sg+nf(Math.abs(sizeDiff),1)+'%',best:nf(mejor)+'%',rec:record}).then(b=>{cardBlob=b});
  res.innerHTML=
   '<div><div class="lbl">Precisión</div><div class="big" id="num">0,00%</div></div>'+
   '<div class="verd hid" id="blk"><b>'+v[1]+'</b><span>'+v[2]+'</span></div>'+
   '<div class="stats hid" id="st"><div><b>'+nf(mm,1)+' mm</b><span>Del centro</span></div><div><b>'+sg+nf(Math.abs(sizeDiff),1)+'%</b><span>Tamaño</span></div><div class="rec"><b>'+nf(mejor)+'%</b><span>'+(record?'¡Récord!':'Tu mejor')+'</span></div></div>'+
   '<div class="acts hid" id="ac"><button id="cp">Compartir <span>↗</span></button><button class="alt" id="again">Otra vez <span>→</span></button></div>';
  res.style.display='flex';
  $('cp').onclick=async()=>{
    const btn=$('cp');
    const blob=cardBlob||await makeCard({x:pos.x,y:pos.y,w:w,score:nf(score),verd:v[1],sub:v[2],mm:nf(mm,1)+' mm',tam:sg+nf(Math.abs(sizeDiff),1)+'%',best:nf(mejor)+'%',rec:record});
    const file=new File([blob],'mdp-ubica-la-camara.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    // Si el dispositivo no puede compartir imágenes: se descarga la tarjeta y se copia el texto
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    try{await navigator.clipboard.writeText(txt)}catch(e){}
    btn.firstChild.textContent='Imagen guardada y texto copiado ';
  };
  $('again').onclick=load;
  // cuenta de 0 al porcentaje logrado
  const dur=Math.max(600,Math.min(2200,score*22)),t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,2); // empieza rápido y frena al final
    $('num').textContent=nf(score*e)+'%';
    if(k<1)anim=requestAnimationFrame(step);
    else{$('num').textContent=nf(score)+'%';['blk','st','ac'].forEach(i=>$(i).classList.remove('hid'))}
  };
  anim=requestAnimationFrame(step);
};
load();
</script>
