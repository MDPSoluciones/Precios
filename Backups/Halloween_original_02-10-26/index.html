<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDP SOLUCIONES</title>

    <!-- Ícono del sitio -->
    <link rel="icon" href="images/logoCircDor.png" type="image/x-icon">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles/styles.css?v=3">

    <!-- Fuente personalizada (Lucidity Expand) desde carpeta local -->
    <style>
        @font-face {
            font-family: "Lucidity Expand";
            src: url("Res/Lucidity-Expand.otf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'LucidityExpand', sans-serif;
        }
    </style>
</head>

<body class="halloween">
    <header id="mainHeader">
        <!-- 🎃 HALLOWEEN (quitar class="halloween" del <body> para desactivar todo) -->
        <div class="halloween-deco web web-left">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
                    <path d="M0 0 L100 0 M0 0 L97 26 M0 0 L82 58 M0 0 L58 82 M0 0 L26 97 M0 0 L0 100"/>
                    <path d="M22 0 Q17 17 0 22 M44 0 Q35 35 0 44 M66 0 Q52 52 0 66 M88 0 Q70 70 0 88"/>
                </g>
            </svg>
        </div>
        <div class="halloween-deco web web-right">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
                    <path d="M0 0 L100 0 M0 0 L97 26 M0 0 L82 58 M0 0 L58 82 M0 0 L26 97 M0 0 L0 100"/>
                    <path d="M22 0 Q17 17 0 22 M44 0 Q35 35 0 44 M66 0 Q52 52 0 66 M88 0 Q70 70 0 88"/>
                </g>
            </svg>
        </div>
        <div class="halloween-deco spider-wrap" id="spiderWrap">
            <div class="spider-thread"></div>
            <svg class="spider" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g stroke="#111" stroke-width="2" stroke-linecap="round" fill="none">
                    <path d="M14 18 L5 11 L2 16 M14 21 L4 21 L2 27 M15 24 L7 31 L8 37 M26 18 L35 11 L38 16 M26 21 L36 21 L38 27 M25 24 L33 31 L32 37"/>
                </g>
                <ellipse cx="20" cy="26" rx="8" ry="9" fill="#1a1a1a"/>
                <circle cx="20" cy="15" r="5.5" fill="#1a1a1a"/>
                <circle cx="18" cy="14" r="1.3" fill="#ff7a00"/>
                <circle cx="22" cy="14" r="1.3" fill="#ff7a00"/>
            </svg>
        </div>
        <div class="header-inner">
            <div class="logo-container">
                <img src="images/LogoPrincDor.png" alt="Logo de la empresa" class="logo">
            </div>
            <div class="title-container">
                <h2>LISTA DE PRECIOS</h2>
            </div>
            <div class="header-controls">
                <!-- Toggle de vista (Lista / Grid) -->
                <div class="view-toggle" title="Cambiar vista">
                    <span class="view-toggle-label" id="labelLista">Lista</span>
                    <label class="switch">
                        <input type="checkbox" id="viewToggle">
                        <span class="slider"></span>
                    </label>
                    <span class="view-toggle-label" id="labelGrid">Grid</span>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Buscar..." />
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor de productos -->
    <section>
        <div id="pricing" class="pricing"></div>
    </section>

    <!-- Botón flotante para WhatsApp -->
    <a href="https://wa.me/5493364202556?text=Hola!%20Estoy%20interesado%20en%20un%20producto." class="whatsapp-float"
        target="_blank" title="Escríbenos por WhatsApp">
        <img src="images/whatsapp-icon.png" alt="WhatsApp" style="width: 60px; height: 60px;">
    </a>

    <!-- Librerías JS externas -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Script principal -->
    <script src="scripts/script.js?v=3"></script>
</body>

</html>
