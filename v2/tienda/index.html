<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDP SOLUCIONES | TIENDA</title>
  <link rel="icon" id="favicon" href="https://mdpsoluciones.com.ar/images/logoCircDor.png" type="image/x-icon">
</head>

<body style="margin:0">
  <iframe src="https://cocoscrm.com/catalog/mdpsoluciones" style="width:100%;height:100vh;border:none"></iframe>

  <script>
    function setFavicon() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('favicon').href = isDark
        ? 'https://mdpsoluciones.com.ar/images/logoCircDor.png'
        : 'https://mdpsoluciones.com.ar/images/logoCircDor.jpg';
    }

    setFavicon();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setFavicon);
  </script>
</body>

</html>
